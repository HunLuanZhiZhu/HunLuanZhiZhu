<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B10"/>
    <stop offset="0.48" stop-color="#0B1118"/>
    <stop offset="1" stop-color="#0A1014"/>
  </linearGradient>

  <linearGradient id="hero" x1="70" y1="70" x2="590" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F8FAFC"/>
    <stop offset="0.56" stop-color="#DDE7F0"/>
    <stop offset="1" stop-color="#9FFFCB"/>
  </linearGradient>

  <linearGradient id="accent" x1="720" y1="65" x2="1110" y2="285" gradientUnits="userSpaceOnUse">
    <stop stop-color="#B7FF4A"/>
    <stop offset="0.48" stop-color="#7DE8FF"/>
    <stop offset="1" stop-color="#C6A7FF"/>
  </linearGradient>

  <radialGradient id="glowL" cx="0" cy="0" r="1" gradientTransform="translate(215 74) rotate(38) scale(340 230)">
    <stop stop-color="#4ADE80" stop-opacity=".18"/>
    <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="glowR" cx="0" cy="0" r="1" gradientTransform="translate(1020 170) rotate(180) scale(360 250)">
    <stop stop-color="#60A5FA" stop-opacity=".19"/>
    <stop offset=".58" stop-color="#A78BFA" stop-opacity=".09"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#D7E2EC" stroke-opacity=".055" stroke-width="1"/>
  </pattern>

  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>

  <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="170%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity=".35"/>
  </filter>

  <clipPath id="panelClip">
    <rect x="682" y="38" width="458" height="264" rx="22"/>
  </clipPath>
</defs>

<rect width="1200" height="340" rx="28" fill="url(#bg)"/>
<rect width="1200" height="340" rx="28" fill="url(#grid)"/>
<rect width="1200" height="340" rx="28" fill="url(#glowL)"/>
<rect width="1200" height="340" rx="28" fill="url(#glowR)"/>

